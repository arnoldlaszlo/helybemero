<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenTopoMap Koordináta Kereső</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
        }
        #map {
            height: 100vh;
            width: 100%;
            z-index: 0;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.1);
        }
        .coord-input {
            width: 140px;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-weight: 600;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .coord-input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }
        .label {
            font-size: 11px;
            color: #475569;
            margin-bottom: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-center {
            align-self: flex-end;
            background: #ef4444;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-center:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <div>
            <div class="label">Szélesség (Lat)</div>
            <input type="number" id="lat-input" class="coord-input" step="0.0001" value="47.4979">
        </div>
        <div>
            <div class="label">Hosszúság (Lon)</div>
            <input type="number" id="lng-input" class="coord-input" step="0.0001" value="19.0402">
        </div>
        <button class="btn-center" onclick="jumpToCoords()" title="Ugrás a koordinátákhoz">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Térkép inicializálása
        const map = L.map('map', {
            worldCopyJump: true,
            zoomControl: false // Egyéni pozicionáláshoz később
        }).setView([47.4979, 19.0402], 13);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // OpenTopoMap réteg
        L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'
        }).addTo(map);

        let horizontalLine, verticalLine;
        const latInput = document.getElementById('lat-input');
        const lngInput = document.getElementById('lng-input');

        // Szálkereszt frissítése (folytonos vonalak)
        function updateCrosshair(lat, lng) {
            if (horizontalLine) map.removeLayer(horizontalLine);
            if (verticalLine) map.removeLayer(verticalLine);

            // Folytonos vízszintes vonal (szélességi kör)
            horizontalLine = L.polyline([[lat, -180], [lat, 180]], {
                color: '#ef4444',
                weight: 2,
                opacity: 0.8,
                interactive: false
            }).addTo(map);

            // Folytonos függőleges vonal (hosszúsági kör)
            verticalLine = L.polyline([[-90, lng], [90, lng]], {
                color: '#ef4444',
                weight: 2,
                opacity: 0.8,
                interactive: false
            }).addTo(map);
        }

        // Térkép mozgatása az inputok alapján
        function jumpToCoords() {
            const lat = parseFloat(latInput.value);
            const lng = parseFloat(lngInput.value);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.panTo([lat, lng]);
                updateCrosshair(lat, lng);
            }
        }

        // Input változás kezelése (nyílgombokhoz is)
        function handleInputChange() {
            const lat = parseFloat(latInput.value);
            const lng = parseFloat(lngInput.value);
            if (!isNaN(lat) && !isNaN(lng)) {
                // Nem pan-olunk automatikusan, csak ha a user kéri vagy kattint, 
                // hogy ne rángassa a térképet gépelés közben, de a vonal frissüljön.
                updateCrosshair(lat, lng);
            }
        }

        latInput.addEventListener('input', handleInputChange);
        lngInput.addEventListener('input', handleInputChange);

        // Kattintás a térképen: frissíti az inputot ÉS a szálkeresztet
        map.on('click', (e) => {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            latInput.value = lat;
            lngInput.value = lng;
            updateCrosshair(lat, lng);
        });

        // Kezdőállapot
        updateCrosshair(47.4979, 19.0402);

    </script>
</body>
</html>
